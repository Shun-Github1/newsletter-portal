name: newsletter_portal
description: Newsletter Portal - Media monitoring report generator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  go_router: ^14.8.1
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^8.2.0
  printing: ^5.13.4
  pdf: ^3.11.2
  intl: ^0.20.3
  shimmer: ^3.0.0
  animate_do: ^5.1.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_light.png
    - assets/images/logo_dark.png
